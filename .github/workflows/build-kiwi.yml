name: Kiwi Network Patches CI

on:
  workflow_dispatch:
  push:
    branches: [main, kiwi]

jobs:
  syntax_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk
        run: sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android

      - name: Pull image
        run: docker pull uazo/chromium:143.0.7499.193

      - name: Compile with g++
        run: |
          docker run -d --name kb uazo/chromium:143.0.7499.193 tail -f /dev/null
          docker exec kb mkdir -p /home/lg/working_dir/net/kiwi
          docker cp "$PWD/patches/ech_kyber_integration/." kb:/home/lg/working_dir/net/kiwi/
          docker exec kb bash -c '
            cd /home/lg/working_dir
            FAIL=0
            for f in net/kiwi/*.cc; do
              base=$(basename $f .cc)
              [ "$base" = "mojo_ipc_integration" ] && echo "SKIP $base.cc" && continue
              echo -n "$base.cc ... "
              g++ -std=c++20 -fPIC -O2 \
                -include /usr/include/features.h -D_GNU_SOURCE \
                -c "$f" \
                -I. -Inet -Ibase -Ibuild -Ibuild_overrides \
                -Ithird_party/boringssl/src/include \
                -Ithird_party/zlib -Iurl -Icrypto \
                -Ithird_party/abseil-cpp -Ithird_party/perfetto \
                -Ithird_party/googletest/src/googletest/include \
                -Ithird_party/partition_alloc \
                -DNET_IMPLEMENTATION=1 -DBORINGSSL_IMPLEMENTATION=1 \
                -DOPENSSL_IS_BORINGSSL=1 \
                -o out/kobj/$base.o 2>/tmp/err && echo "OK" \
                || { echo "FAIL"; head -3 /tmp/err; FAIL=$((FAIL+1)); }
            done
            echo "Result: $FAIL failures"
            exit $FAIL
          '
          docker rm -f kb

  build_apk:
    # needs: [syntax_check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk
        run: sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android

      - name: Pull image
        run: docker pull uazo/chromium:143.0.7499.193

      - name: Check source tree
        run: |
          docker run -d --name kb uazo/chromium:143.0.7499.193 tail -f /dev/null
          echo "=== Source locations ==="
          docker exec kb ls -la /home/lg/ 2>&1
          echo "=== kiwi-src ==="
          docker exec kb ls /home/lg/kiwi-src/ 2>&1 | head -10
          echo "=== working_dir ==="
          docker exec kb ls /home/lg/working_dir/ 2>&1 | head -10
          echo "=== gn location ==="
          docker exec kb find /home/lg -name "gn" -type f 2>/dev/null | head -5
          docker exec kb find /home/lg -name "ninja" -type f 2>/dev/null | head -5
          echo "=== build tools ==="
          docker exec kb ls /home/lg/.caspide/ 2>/dev/null || echo "no .caspide"
          docker exec kb ls /home/lg/chromium/src/buildtools/ 2>/dev/null | head -5 || echo "no buildtools"
          docker rm -f kb

      - name: Apply patches & gn gen
        run: |
          docker exec kb bash -c '
            cd /home/lg/kiwi-src
            echo "=== Applying patches ==="
            for pf in /tmp/p/*.patch; do
              [ -f "$pf" ] || continue
              patch -p1 --force < "$pf" 2>&1 | tail -3 && echo "OK $(basename $pf)" || echo "SKIP $(basename $pf)"
            done
            echo "=== Copy kiwi files ==="
            mkdir -p net/kiwi/unittests
            cp /tmp/p/ech_kyber_integration/*.cc net/kiwi/ 2>/dev/null || echo "no .cc files"
            cp /tmp/p/ech_kyber_integration/*.h net/kiwi/ 2>/dev/null || echo "no .h files"
            cp /tmp/p/ech_kyber_integration/BUILD.gn net/kiwi/ 2>/dev/null || echo "no BUILD.gn"
            echo "=== Sed integrations ==="
            grep -q "kiwi_ssl_config" net/socket/ssl_client_socket.cc 2>/dev/null || sed -i "/#include \"net\/ssl\/ssl_config\"/a #include \"net\/kiwi\/kiwi_ssl_config.h\"" net/socket/ssl_client_socket.cc 2>/dev/null || echo "sed ssl failed"
            grep -q "ConfigureKiwiSSL" net/socket/ssl_client_socket.cc 2>/dev/null || sed -i "/SSL_set_connect_state(ssl_.get())/a \/\/ Kiwi SSL\n  ConfigureKiwiSSL(ssl_.get(), ssl_ctx_.get(), ssl_config_);" net/socket/ssl_client_socket.cc 2>/dev/null || echo "sed ssl2 failed"
            grep -q "kiwi_dns_handler" net/dns/host_resolver_manager.cc 2>/dev/null || sed -i "/#include \"net\/dns\/host_resolver_manager.h\"/a #include \"net\/kiwi\/kiwi_dns_handler.h\"" net/dns/host_resolver_manager.cc 2>/dev/null || echo "sed dns failed"
            grep -q "kiwi_url_request" net/url_request/url_request_http_job.cc 2>/dev/null || sed -i "/#include \"net\/url_request\/url_request_http_job.h\"/a #include \"net\/kiwi\/kiwi_url_request.h\"" net/url_request/url_request_http_job.cc 2>/dev/null || echo "sed url failed"
            grep -q "kiwi_system_net" chrome/browser/net/system_network_context_manager.cc 2>/dev/null || sed -i "/#include \"chrome\/browser\/net\/system_network_context_manager.h\"/a #include \"net\/kiwi\/kiwi_system_net.h\"" chrome/browser/net/system_network_context_manager.cc 2>/dev/null || echo "sed sys failed"
            sed -i "s/base::FEATURE_DISABLED_BY_DEFAULT};$/base::FEATURE_ENABLED_BY_DEFAULT};/g" net/base/features.cc 2>/dev/null || echo "sed feat failed"
            echo "=== Patch done ==="
          '
          docker rm -f kb

      - name: Find gn/ninja
        run: |
          docker run --rm uazo/chromium:143.0.7499.193 bash -c '
            echo "=== Find in /home/lg ==="
            find /home/lg -name "gn" -type f 2>/dev/null
            find /home/lg -name "ninja" -type f 2>/dev/null
            echo "=== Find in PATH ==="
            which gn ninja 2>&1
            echo "=== Find in /usr ==="
            find /usr -name "gn" -type f 2>/dev/null | head -5
            find /usr -name "ninja" -type f 2>/dev/null | head -5
            echo "=== caspide ==="
            ls /home/lg/.caspide/ 2>/dev/null || echo "no .caspide"
            find /home/lg/.caspide -name "gn" 2>/dev/null | head -5
            echo "=== chromium buildtools ==="
            ls /home/lg/chromium/src/buildtools/linux64/ 2>/dev/null | head -5
            ls /home/lg/chromium/src/third_party/llvm-build/Release+Asserts/bin/ 2>/dev/null | head -5
          '

      - name: GN Gen & Ninja build
        timeout-minutes: 180
        run: |
          # Start container with patches volume
          docker run -d --name kb -v "$PWD/patches:/tmp/p:ro" uazo/chromium:143.0.7499.193 tail -f /dev/null

          # Apply patches
          docker exec kb bash -c '
            cd /home/lg/kiwi-src
            echo "=== Applying patches ==="
            for pf in /tmp/p/*.patch; do
              [ -f "$pf" ] || continue
              patch -p1 --force < "$pf" 2>&1 | tail -2
            done
            echo "=== Copy kiwi files ==="
            mkdir -p net/kiwi/unittests
            cp /tmp/p/ech_kyber_integration/*.cc net/kiwi/ 2>/dev/null || true
            cp /tmp/p/ech_kyber_integration/*.h net/kiwi/ 2>/dev/null || true
            cp /tmp/p/ech_kyber_integration/BUILD.gn net/kiwi/ 2>/dev/null || true
            echo "=== Patch done ==="
          '

          # Find and run gn gen
          docker exec kb bash -c '
            cd /home/lg/kiwi-src
            # Try to find gn
            GN=$(find /home/lg -name "gn" -type f 2>/dev/null | head -1)
            if [ -z "$GN" ]; then
              GN=$(find /usr -name "gn" -type f 2>/dev/null | head -1)
            fi
            if [ -z "$GN" ]; then
              echo "ERROR: gn not found anywhere!"
              echo "Available in /home/lg:"
              find /home/lg -maxdepth 3 -type f -executable | head -20
              exit 1
            fi
            echo "Found gn at: $GN"
            $GN --version

            # Try to find ninja
            NINJA=$(find /home/lg -name "ninja" -type f 2>/dev/null | head -1)
            if [ -z "$NINJA" ]; then
              NINJA=$(find /usr -name "ninja" -type f 2>/dev/null | head -1)
            fi
            if [ -z "$NINJA" ]; then
              echo "ERROR: ninja not found anywhere!"
              exit 1
            fi
            echo "Found ninja at: $NINJA"
            $NINJA --version

            # Run gn gen
            $GN gen out/android --args="target_os=\"android\" target_cpu=\"arm64\" is_debug=false symbol_level=0 is_official_build=true enable_remoting=false enable_nacl=false proprietary_codecs=false ffmpeg_branding=\"Chromium\" enable_quic=true enable_http3=true enable_ech=true enable_quic_connection_migration=true enable_quic_0rtt=true"
            echo "=== gn gen done ==="

            # Run ninja
            $NINJA -C out/android chrome_public_apk
            echo "=== ninja done ==="
            ls -la out/android/apks/ 2>/dev/null || echo "no apks dir"
          '

          # Extract APK
          mkdir -p apk-output
          docker cp kb:/home/lg/kiwi-src/out/android/apks/ apk-output/ 2>/dev/null || true
          find apk-output/ -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-apk
          path: apk-output/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker rm -f kb 2>/dev/null
