name: Kiwi Network Patches CI

on:
  workflow_dispatch:
  push:
    branches: [main, kiwi]

jobs:
  syntax_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk
        run: sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android

      - name: Pull image
        run: docker pull uazo/chromium:143.0.7499.193

      - name: Compile with g++
        run: |
          docker run -d --name kb uazo/chromium:143.0.7499.193 tail -f /dev/null
          docker exec kb mkdir -p /home/lg/working_dir/net/kiwi
          docker cp "$PWD/patches/ech_kyber_integration/." kb:/home/lg/working_dir/net/kiwi/
          docker exec kb bash -c '
            cd /home/lg/working_dir
            FAIL=0
            for f in net/kiwi/*.cc; do
              base=$(basename $f .cc)
              [ "$base" = "mojo_ipc_integration" ] && echo "SKIP $base.cc" && continue
              echo -n "$base.cc ... "
              g++ -std=c++20 -fPIC -O2 \
                -include /usr/include/features.h -D_GNU_SOURCE \
                -c "$f" \
                -I. -Inet -Ibase -Ibuild -Ibuild_overrides \
                -Ithird_party/boringssl/src/include \
                -Ithird_party/zlib -Iurl -Icrypto \
                -Ithird_party/abseil-cpp -Ithird_party/perfetto \
                -Ithird_party/googletest/src/googletest/include \
                -Ithird_party/partition_alloc \
                -DNET_IMPLEMENTATION=1 -DBORINGSSL_IMPLEMENTATION=1 \
                -DOPENSSL_IS_BORINGSSL=1 \
                -o out/kobj/$base.o 2>/tmp/err && echo "OK" \
                || { echo "FAIL"; head -3 /tmp/err; FAIL=$((FAIL+1)); }
            done
            echo "Result: $FAIL failures"
            exit $FAIL
          '
          docker rm -f kb

  build_apk:
    # needs: [syntax_check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk
        run: sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android

      - name: Pull image
        run: docker pull uazo/chromium:143.0.7499.193

      - name: Full build (find tools, apply patches, gn gen, ninja)
        timeout-minutes: 300
        run: |
          set -ex
          # Start container
          docker run -d --name kb -v "$PWD/patches:/tmp/p:ro" uazo/chromium:143.0.7499.193 tail -f /dev/null

          # Step 1: Check what's in the image
          echo "=== Source locations ==="
          docker exec kb ls /home/lg/ 2>&1
          docker exec kb ls /home/lg/kiwi-src/ 2>&1 | head -5
          docker exec kb ls /home/lg/working_dir/ 2>&1 | head -5

          # Step 2: Find gn and ninja (search everywhere)
          echo "=== Finding build tools ==="
          GN_PATH=$(docker exec kb find /home/lg /usr /opt -name "gn" -type f 2>/dev/null | head -1)
          NINJA_PATH=$(docker exec kb find /home/lg /usr /opt -name "ninja" -type f 2>/dev/null | head -1)
          echo "gn=$GN_PATH ninja=$NINJA_PATH"

          # Step 3: If not found, install as root
          if [ -z "$GN_PATH" ] || [ -z "$NINJA_PATH" ]; then
            echo "=== Installing missing tools as root ==="
            docker exec -u root kb bash -c '
              apt-get update -qq
              apt-get install -y -qq ninja-build curl unzip 2>/dev/null
              cd /tmp
              curl -sL "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest" -o gn.zip
              unzip -o gn.zip
              chmod +x gn
              cp gn /usr/local/bin/
            '
            GN_PATH=$(docker exec kb which gn 2>/dev/null || echo "/usr/local/bin/gn")
            NINJA_PATH=$(docker exec kb which ninja 2>/dev/null || echo "/usr/bin/ninja")
          fi
          echo "Using: gn=$GN_PATH ninja=$NINJA_PATH"
          docker exec kb "$GN_PATH" --version
          docker exec kb "$NINJA_PATH" --version

          # Step 4: Apply patches
          echo "=== Applying patches ==="
          docker exec kb bash -c "
            cd /home/lg/kiwi-src
            for pf in /tmp/p/*.patch; do
              [ -f \"\$pf\" ] || continue
              patch -p1 --force < \"\$pf\" 2>&1 | tail -2 && echo \"OK \$(basename \$pf)\" || echo \"SKIP \$(basename \$pf)\"
            done
            mkdir -p net/kiwi/unittests
            cp /tmp/p/ech_kyber_integration/*.cc net/kiwi/ 2>/dev/null || true
            cp /tmp/p/ech_kyber_integration/*.h net/kiwi/ 2>/dev/null || true
            cp /tmp/p/ech_kyber_integration/BUILD.gn net/kiwi/ 2>/dev/null || true
            echo '=== Patch done ==='
          "

          # Step 5: Run gn gen
          echo "=== Running gn gen ==="
          docker exec kb bash -c "
            cd /home/lg/kiwi-src
            $GN_PATH gen out/android --args='target_os=\"android\" target_cpu=\"arm64\" is_debug=false symbol_level=0 is_official_build=true enable_remoting=false enable_nacl=false proprietary_codecs=false ffmpeg_branding=\"Chromium\" enable_quic=true enable_http3=true enable_ech=true enable_quic_connection_migration=true enable_quic_0rtt=true'
            echo '=== gn gen done ==='
          "

          # Step 6: Run ninja
          echo "=== Running ninja build ==="
          docker exec kb bash -c "
            cd /home/lg/kiwi-src
            $NINJA_PATH -C out/android chrome_public_apk
            echo '=== ninja done ==='
            ls -la out/android/apks/ 2>/dev/null || echo 'no apks dir'
            find out/android -name '*.apk' 2>/dev/null | head -5
          "

          # Step 7: Extract APK
          echo "=== Extracting APK ==="
          mkdir -p apk-output
          docker cp kb:/home/lg/kiwi-src/out/android/apks/ apk-output/ 2>/dev/null || true
          find apk-output/ -name "*.apk" -exec ls -lh {} \;

          # Cleanup
          docker rm -f kb

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-apk
          path: apk-output/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker rm -f kb 2>/dev/null
