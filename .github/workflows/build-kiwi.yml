name: Kiwi Network Patches Build

on:
  workflow_dispatch:
  push:
    branches: [kiwi]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build curl unzip python3-pip

      - name: Clone Kiwi source (shallow)
        run: |
          git clone --depth=1 -b kiwi https://github.com/kiwibrowser/src.next.git /home/runner/kiwi-src 2>&1 | tail -5

      - name: Apply patches
        run: |
          cd /home/runner/kiwi-src
          for pf in "$GITHUB_WORKSPACE/patches"/*.patch; do
            [ -f "$pf" ] || continue
            patch -p1 --force < "$pf" 2>&1 | tail -2
          done
          mkdir -p net/kiwi/unittests
          cp "$GITHUB_WORKSPACE/patches"/ech_kyber_integration/*.cc net/kiwi/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/patches"/ech_kyber_integration/*.h net/kiwi/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/patches"/ech_kyber_integration/BUILD.gn net/kiwi/ 2>/dev/null || true
          # sed integrations
          grep -q "kiwi_ssl_config" net/socket/ssl_client_socket.cc 2>/dev/null || \
            sed -i "/#include \"net\/ssl\/ssl_config\"/a #include \"net\/kiwi\/kiwi_ssl_config.h\"" net/socket/ssl_client_socket.cc 2>/dev/null || true
          grep -q "ConfigureKiwiSSL" net/socket/ssl_client_socket.cc 2>/dev/null || \
            sed -i "/SSL_set_connect_state(ssl_.get())/a \/\/ Kiwi SSL\n  ConfigureKiwiSSL(ssl_.get(), ssl_ctx_.get(), ssl_config_);" net/socket/ssl_client_socket.cc 2>/dev/null || true
          grep -q "kiwi_dns_handler" net/dns/host_resolver_manager.cc 2>/dev/null || \
            sed -i "/#include \"net\/dns\/host_resolver_manager.h\"/a #include \"net\/kiwi\/kiwi_dns_handler.h\"" net/dns/host_resolver_manager.cc 2>/dev/null || true
          grep -q "kiwi_url_request" net/url_request/url_request_http_job.cc 2>/dev/null || \
            sed -i "/#include \"net\/url_request\/url_request_http_job.h\"/a #include \"net\/kiwi\/kiwi_url_request.h\"" net/url_request/url_request_http_job.cc 2>/dev/null || true
          grep -q "kiwi_system_net" chrome/browser/net/system_network_context_manager.cc 2>/dev/null || \
            sed -i "/#include \"chrome\/browser\/net\/system_network_context_manager.h\"/a #include \"net\/kiwi\/kiwi_system_net.h\"" chrome/browser/net/system_network_context_manager.cc 2>/dev/null || true
          sed -i "s/base::FEATURE_DISABLED_BY_DEFAULT};$/base::FEATURE_ENABLED_BY_DEFAULT};/g" net/base/features.cc 2>/dev/null || true
          echo "Patches applied"

      - name: Install Chromium build deps
        run: |
          cd /home/runner/kiwi-src
          # Run Chromium's install-build-deps for Android
          sudo ./build/install-build-deps.sh --android --no-prompt 2>&1 | tail -10 || echo "install-build-deps may have failed, continuing"

      - name: Get Clang toolchain
        run: |
          cd /home/runner/kiwi-src
          python3 tools/clang/scripts/update.py 2>&1 | tail -5 || echo "clang update failed"
          ls third_party/llvm-build/Release+Asserts/bin/clang++ 2>/dev/null || echo "no clang++"

      - name: GN Gen
        run: |
          cd /home/runner/kiwi-src
          # depot_tools gn or buildtools gn?
          GN=$(find /home/runner/kiwi-src/buildtools -name "gn" -type f 2>/dev/null | head -1)
          if [ -z "$GN" ]; then
            # Try to install gn
            cd /tmp
            curl -sL "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest" -o gn.zip
            unzip -o gn.zip 2>/dev/null
            chmod +x gn
            GN=/tmp/gn
          fi
          echo "Using gn: $GN"
          cd /home/runner/kiwi-src
          $GN gen out/android --args="target_os=\"android\" target_cpu=\"arm64\" is_debug=false symbol_level=0 is_official_build=true enable_remoting=false enable_nacl=false proprietary_codecs=false ffmpeg_branding=\"Chromium\" enable_quic=true enable_http3=true enable_ech=true enable_quic_connection_migration=true enable_quic_0rtt=true" 2>&1

      - name: Ninja build
        timeout-minutes: 180
        run: |
          cd /home/runner/kiwi-src
          ninja -C out/android chrome_public_apk 2>&1

      - name: Extract APK
        if: always()
        run: |
          mkdir -p apk-output
          find /home/runner/kiwi-src/out/android -name "*.apk" -exec cp {} apk-output/ \; 2>/dev/null || true
          ls -lh apk-output/ 2>/dev/null || echo "no APK files"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-apk
          path: apk-output/
          if-no-files-found: ignore
