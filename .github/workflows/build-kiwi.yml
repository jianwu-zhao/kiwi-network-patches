name: Kiwi Network Patches Build

on:
  workflow_dispatch:
  push:
    branches: [kiwi]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build curl unzip python3-pip

      - name: Clone Kiwi source
        run: |
          rm -rf /home/runner/kiwi-src
          git clone --depth=1 -b kiwi https://github.com/kiwibrowser/src.next.git /home/runner/kiwi-src
          ls /home/runner/kiwi-src/build/install-build-deps.sh
          ls /home/runner/kiwi-src/net/BUILD.gn

      - name: Apply patches
        run: |
          set +e
          cd /home/runner/kiwi-src
          for f in "$GITHUB_WORKSPACE/patches"/*.patch; do
            [ -f "$f" ] && patch -p1 --force < "$f" && echo "OK: $(basename $f)" || echo "SKIP: $(basename $f)"
          done
          mkdir -p net/kiwi/unittests
          for ext in cc h; do
            for f in "$GITHUB_WORKSPACE/patches/ech_kyber_integration"/*.$ext; do
              [ -f "$f" ] && cp "$f" net/kiwi/ && echo "OK: $(basename $f)"
            done
          done
          cp "$GITHUB_WORKSPACE/patches/ech_kyber_integration/BUILD.gn" net/kiwi/ 2>/dev/null && echo "OK: BUILD.gn"
          for tgt in \
            "kiwi_ssl_config|net/socket/ssl_client_socket.cc|#include \"net/ssl/ssl_config\"|#include \"net/kiwi/kiwi_ssl_config.h\"" \
            "ConfigureKiwiSSL|net/socket/ssl_client_socket.cc|SSL_set_connect_state(ssl_.get())|// Kiwi SSL\n  ConfigureKiwiSSL(ssl_.get(), ssl_ctx_.get(), ssl_config_)" \
            "kiwi_dns_handler|net/dns/host_resolver_manager.cc|#include \"net/dns/host_resolver_manager.h\"|#include \"net/kiwi/kiwi_dns_handler.h\"" \
            "kiwi_url_request|net/url_request/url_request_http_job.cc|#include \"net/url_request/url_request_http_job.h\"|#include \"net/kiwi/kiwi_url_request.h\"" \
            "kiwi_system_net|chrome/browser/net/system_network_context_manager.cc|#include \"chrome/browser/net/system_network_context_manager.h\"|#include \"net/kiwi/kiwi_system_net.h\""; do
            marker=$(echo "$tgt" | cut -d'|' -f1)
            file=$(echo "$tgt" | cut -d'|' -f2)
            after=$(echo "$tgt" | cut -d'|' -f3)
            insert=$(echo "$tgt" | cut -d'|' -f4)
            grep -q "$marker" "$file" 2>/dev/null || \
              sed -i "/$after/a $insert" "$file" 2>/dev/null && echo "OK: sed $marker" || echo "SKIP: sed $marker"
          done
          sed -i "s/base::FEATURE_DISABLED_BY_DEFAULT};$/base::FEATURE_ENABLED_BY_DEFAULT};/g" net/base/features.cc 2>/dev/null && echo "OK: enable features" || echo "SKIP: enable features"
          set -e

      - name: Install Chromium build deps
        run: |
          cd /home/runner/kiwi-src
          sudo ./build/install-build-deps.sh --android --no-prompt

      - name: Get Clang toolchain
        run: |
          cd /home/runner/kiwi-src
          python3 tools/clang/scripts/update.py
          ls -la third_party/llvm-build/Release+Asserts/bin/clang++

      - name: Install gn
        run: |
          # Check buildtools first (official path)
          if [ -f /home/runner/kiwi-src/buildtools/linux64/gn ]; then
            GN=/home/runner/kiwi-src/buildtools/linux64/gn
            echo "Using gn from buildtools"
            $GN --version
            sudo cp $GN /usr/local/bin/
            exit 0
          fi
          # Download
          mkdir -p /tmp/gn-install
          curl -sL --max-time 60 "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest" -o /tmp/gn-install/gn.zip
          if [ -s /tmp/gn-install/gn.zip ]; then
            (cd /tmp/gn-install && unzip -o gn.zip)
            sudo cp /tmp/gn-install/gn /usr/local/bin/
          else
            cd /home/runner/kiwi-src/tools/gn
            python3 bootstrap.py
            sudo cp out/gn /usr/local/bin/
          fi
          gn --version

      - name: GN Gen
        run: |
          cd /home/runner/kiwi-src
          gn --version
          gn gen out/android --args='target_os="android" target_cpu="arm64" is_debug=false symbol_level=0 is_official_build=true enable_remoting=false enable_nacl=false proprietary_codecs=false ffmpeg_branding="Chromium" enable_quic=true enable_http3=true enable_ech=true enable_quic_connection_migration=true enable_quic_0rtt=true'

      - name: Ninja build
        timeout-minutes: 180
        run: |
          cd /home/runner/kiwi-src
          ninja --version
          ninja -C out/android chrome_public_apk

      - name: Extract APK
        if: always()
        run: |
          mkdir -p apk-output
          find /home/runner/kiwi-src/out/android -name "*.apk" -exec cp {} apk-output/ \;
          ls -lh apk-output/ || echo "no APK files"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-apk
          path: apk-output/
          if-no-files-found: ignore
