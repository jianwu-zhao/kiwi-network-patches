name: Verify Kiwi Network Patches

on:
  workflow_dispatch:
  push:
    branches: [main, kiwi]

env:
  CHROMIUM_SRC: ${{ github.workspace }}/src

jobs:
  # -----------------------------------------------------------
  # Verify patch file structure
  # -----------------------------------------------------------
  verify_patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Check patch files exist
        run: |
          echo "CC files: $(ls patches/ech_kyber_integration/*.cc 2>/dev/null | wc -l)"
          echo "H  files: $(ls patches/ech_kyber_integration/*.h 2>/dev/null | wc -l)"
          echo "BUILD.gn: $(ls patches/ech_kyber_integration/BUILD.gn 2>/dev/null)"

  # -----------------------------------------------------------
  # Compile inside uazo's Docker image (has full Chromium + toolchain)
  # -----------------------------------------------------------
  compile_patches:
    needs: [verify_patches]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk
        run: sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android

      - name: Pull Chromium build image
        run: docker pull uazo/chromium:143.0.7499.193

      - name: Compile Kiwi .cc files inside container (no gn)
        run: |
          # Create a temp container and copy files
          docker run -d --name kb uazo/chromium:143.0.7499.193 tail -f /dev/null

          # Copy Kiwi patches into source tree
          docker exec kb mkdir -p /home/lg/working_dir/net/kiwi
          docker cp patches/ech_kyber_integration/. kb:/home/lg/working_dir/net/kiwi/ 2>/dev/null || true

          # Show copied files
          echo "=== Files in net/kiwi/ ==="
          docker exec kb ls -la /home/lg/working_dir/net/kiwi/ | head -20

          # Compile each .cc file, capture ALL errors
          echo "=== Compilation ==="
          docker exec kb bash -c '
            cd /home/lg/working_dir || exit 1
            INCS="-I. -Inet -Ibase -Ibuild -Ibuild_overrides"
            INCS="$INCS -Ithird_party/boringssl/src/include"
            INCS="$INCS -Ithird_party/zlib -Iurl -Icrypto"
            INCS="$INCS -Ithird_party/abseil-cpp -Ithird_party/perfetto"
            INCS="$INCS -Ithird_party/googletest/src/googletest/include"
            INCS="$INCS -Ithird_party/partition_alloc"
            DEFS="-DNET_IMPLEMENTATION=1 -DBORINGSSL_IMPLEMENTATION=1 -DOPENSSL_IS_BORINGSSL=1"
            CXX="clang++ -std=c++20 -fPIC -O2 -stdlib=libc++"
            mkdir -p out/kiwi_obj
            FAIL=0
            for f in net/kiwi/*.cc; do
              base=$(basename $f .cc)
              [ "$base" = "mojo_ipc_integration" ] && echo "SKIP: $base.cc (needs mojom)" && continue
              echo "--- $base.cc ---"
              $CXX -c "$f" $INCS $DEFS -o out/kiwi_obj/$base.o 2>&1 | head -20
              if [ "${PIPESTATUS[0]}" -eq 0 ]; then
                echo "PASS: $base.cc"
              else
                echo "FAIL: $base.cc"
                FAIL=$((FAIL+1))
              fi
            done
            echo "=== Result: $FAIL failures ==="
            exit $FAIL
          ' 2>&1 | head -100

      - name: Cleanup
        if: always()
        run: docker rm -f kb 2>/dev/null
