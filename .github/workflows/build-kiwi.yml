name: Kiwi Network Patches Build

on:
  workflow_dispatch:
  push:
    branches: [kiwi]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Pull Docker image (Chromium 143 source + depot_tools)
        run: docker pull uazo/chromium:143.0.7499.193

      - name: Build APK
        timeout-minutes: 300
        run: |
          # Start container with patches mounted
          docker run -d --name kb -v "$PWD/patches:/tmp/p:ro" uazo/chromium:143.0.7499.193 tail -f /dev/null

          SRC=/home/lg/working_dir/chromium/src
          DT=/home/lg/working_dir/depot_tools

          # Install clang (required by Chromium build)
          docker exec -u root kb bash -c '
            apt-get update -qq && apt-get install -y -qq clang lld 2>/dev/null
            which clang++ && clang++ --version || echo "WARNING: clang++ not available"
          '

          # Apply patches
          docker exec kb bash -c "
            cd $SRC || exit 1
            echo '=== Apply .patch files ==='
            for f in /tmp/p/*.patch; do
              [ -f \"\$f\" ] && patch -p1 --force < \"\$f\" && echo \"OK: \$(basename \$f)\" || echo \"SKIP: \$(basename \$f)\"
            done
            mkdir -p net/kiwi/unittests
            for ext in cc h; do
              for f in /tmp/p/ech_kyber_integration/*.\$ext; do
                [ -f \"\$f\" ] && cp \"\$f\" net/kiwi/ && echo \"OK: \$(basename \$f)\"
              done
            done
            cp /tmp/p/ech_kyber_integration/BUILD.gn net/kiwi/ 2>/dev/null && echo 'OK: BUILD.gn'
            # sed integrations
            for tgt in \
              'kiwi_ssl_config|net/socket/ssl_client_socket.cc|\"'\"'\"'#include \"net/ssl/ssl_config\"'\"'\"'|\"'\"'\"'#include \"net/kiwi/kiwi_ssl_config.h\"'\"'\"'' \
              'ConfigureKiwiSSL|net/socket/ssl_client_socket.cc|SSL_set_connect_state|// Kiwi SSL\n  ConfigureKiwiSSL(ssl_.get(), ssl_ctx_.get(), ssl_config_)' \
              'kiwi_dns_handler|net/dns/host_resolver_manager.cc|\"'\"'\"'#include \"net/dns/host_resolver_manager.h\"'\"'\"'|\"'\"'\"'#include \"net/kiwi/kiwi_dns_handler.h\"'\"'\"'' \
              'kiwi_url_request|net/url_request/url_request_http_job.cc|\"'\"'\"'#include \"net/url_request/url_request_http_job.h\"'\"'\"'|\"'\"'\"'#include \"net/kiwi/kiwi_url_request.h\"'\"'\"'' \
              'kiwi_system_net|chrome/browser/net/system_network_context_manager.cc|\"'\"'\"'#include \"chrome/browser/net/system_network_context_manager.h\"'\"'\"'|\"'\"'\"'#include \"net/kiwi/kiwi_system_net.h\"'\"'\"''; do
              IFS='|' read -r marker file after insert <<< \"\$tgt\"
              grep -q \"\$marker\" \"\$file\" 2>/dev/null || \
                sed -i \"/\$after/a \$insert\" \"\$file\" 2>/dev/null && echo \"OK: sed \$marker\" || echo \"SKIP: sed \$marker\"
            done
            sed -i 's/base::FEATURE_DISABLED_BY_DEFAULT};$/base::FEATURE_ENABLED_BY_DEFAULT};/g' net/base/features.cc 2>/dev/null && echo 'OK: enable features' || echo 'SKIP: enable features'
            echo '=== Patches applied ==='
          "

          # gn gen
          docker exec kb bash -c "
            export PATH=\"$DT:\$PATH\"
            cd $SRC
            gn --version
            gn gen out/android --args='target_os=\"android\" target_cpu=\"arm64\" is_debug=false symbol_level=0 is_official_build=true enable_remoting=false enable_nacl=false proprietary_codecs=false ffmpeg_branding=\"Chromium\" enable_quic=true enable_http3=true enable_ech=true enable_quic_connection_migration=true enable_quic_0rtt=true'
            echo '=== gn gen done (exit: \$?) ==='
          "

          # ninja build
          docker exec kb bash -c "
            export PATH=\"$DT:\$PATH\"
            cd $SRC
            ninja --version
            ninja -C out/android chrome_public_apk
            echo '=== ninja done ==='
            find out/android -name '*.apk' 2>/dev/null | head -5
          "

          # Extract APK
          mkdir -p apk-output
          docker cp kb:$SRC/out/android/apks/ apk-output/ 2>/dev/null || true
          docker cp kb:$SRC/out/android/Release/ apk-output/ 2>/dev/null || true
          find apk-output/ -name "*.apk" -exec ls -lh {} \; || echo "no apk found"
          docker rm -f kb || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-apk
          path: apk-output/
          if-no-files-found: ignore
