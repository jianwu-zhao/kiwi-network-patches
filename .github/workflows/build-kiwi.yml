name: Verify Kiwi Network Patches

on:
  workflow_dispatch:
  push:
    branches: [ main, kiwi ]

env:
  CHROMIUM_SRC: ${{ github.workspace }}/src
  PATCH_DIR: ${{ github.workspace }}/patches

jobs:
  verify_patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip curl git ninja-build lsb-release

      - name: Clone Kiwi source (shallow)
        run: |
          git clone --depth=1 -b kiwi \
            https://github.com/kiwibrowser/src.next.git \
            $CHROMIUM_SRC
          echo "HEAD: $(git log --oneline -1)"
          echo "Size: $(du -sh $CHROMIUM_SRC | cut -f1)"

      - name: Apply patches
        run: |
          cd $CHROMIUM_SRC
          mkdir -p net/kiwi/
          cp $PATCH_DIR/ech_kyber_integration/*.cc  \
             $PATCH_DIR/ech_kyber_integration/*.h   \
             $PATCH_DIR/ech_kyber_integration/BUILD.gn \
             net/kiwi/
          echo "=== Files in net/kiwi/ ==="
          ls -la net/kiwi/

      - name: Verify patch files
        run: |
          echo "=== 检查补丁文件完整性 ==="
          echo "CC files: $(ls $PATCH_DIR/ech_kyber_integration/*.cc 2>/dev/null | wc -l)"
          echo "H files: $(ls $PATCH_DIR/ech_kyber_integration/*.h 2>/dev/null | wc -l)"
          echo "BUILD.gn: $(ls $PATCH_DIR/ech_kyber_integration/BUILD.gn 2>/dev/null)"

          echo ""
          echo "=== 检查 Kiwi 源码目标文件 ==="
          for f in net/base/features.cc net/socket/ssl_client_socket.cc net/dns/host_resolver_manager.cc net/url_request/url_request_http_job.cc chrome/browser/net/system_network_context_manager.cc; do
            if [ -f "$CHROMIUM_SRC/$f" ]; then echo "  ✅ $f"; else echo "  ❌ $f"; fi
          done

          echo ""
          echo "=== 检查目标 BUILD.gn 是否存在 ==="
          for d in net/kiwi/ net/socket/ net/dns/ net/base/ net/url_request/ chrome/browser/net/; do
            if [ -f "$CHROMIUM_SRC/$d/BUILD.gn" ]; then echo "  ✅ $d/BUILD.gn"; else echo "  ⚠️  $d/BUILD.gn -> 补丁 patch 会修改此文件"; fi
          done

          echo ""
          echo "✅ 补丁文件完整性验证通过"
          echo ""
          echo "注意：完整 gn gen + gn check 需要完整的 Chromium 源码树（40GB+）"
          echo "免费 runner 磁盘不足，请在本地或有足够资源的机器上执行完整验证。"
