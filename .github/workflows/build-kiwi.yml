name: Kiwi Network Patches Build

on:
  workflow_dispatch:
  push:
    branches: [kiwi]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Pull Chromium Docker image
        run: |
          # Pull the image layer by layer with progress
          docker pull uazo/chromium:143.0.7499.193
          echo "PULL DONE"

      - name: Check image contents (10min debug saver)
        run: |
          docker run --rm uazo/chromium:143.0.7499.193 bash -c '
            echo "PATH=$PATH"
            echo "---"
            which gn ninja clang++ g++ 2>&1
            echo "---"
            find / -maxdepth 4 -name "gn" -o -name "ninja" -o -name "clang++" 2>/dev/null
            echo "---"
            ls /home/lg/ 2>&1
          '

      - name: Full build
        timeout-minutes: 300
        run: |
          # Copy patches and build script into container
          docker run -d --name kb uazo/chromium:143.0.7499.193 tail -f /dev/null

          # Check directory structure
          docker exec kb bash -c '
            echo "=== Home ==="
            ls /home/lg/
            echo "=== kiwi-src? ==="
            ls /home/lg/kiwi-src/ 2>/dev/null | head -3 || echo "NOT FOUND"
            echo "=== working_dir? ==="
            ls /home/lg/working_dir/ 2>/dev/null | head -3 || echo "NOT FOUND"
            echo "=== tools PATH ==="
            echo $PATH
            which g++ 2>/dev/null
          '

          # Apply patches
          docker cp "$PWD/patches/." kb:/tmp/patches/
          docker exec kb bash -c '
            # Find source dir
            for dir in /home/lg/kiwi-src /home/lg/working_dir /home/lg/chromium/src; do
              if [ -d "$dir" ] && [ -f "$dir/net/BUILD.gn" ]; then
                SRC=$dir
                echo "Source found: $SRC"
                break
              fi
            done
            if [ -z "$SRC" ]; then
              echo "No Chromium source found!"
              find /home/lg -maxdepth 2 -type d | head -20
              exit 1
            fi

            cd "$SRC"

            # Apply .patch files
            for pf in /tmp/patches/*.patch; do
              [ -f "$pf" ] || continue
              patch -p1 --force < "$pf" 2>&1 | tail -2 && echo "PATCH OK: $(basename $pf)" || echo "PATCH SKIP: $(basename $pf)"
            done

            # Copy kiwi files
            mkdir -p net/kiwi/unittests
            cp /tmp/patches/ech_kyber_integration/*.cc net/kiwi/ 2>/dev/null || true
            cp /tmp/patches/ech_kyber_integration/*.h net/kiwi/ 2>/dev/null || true
            cp /tmp/patches/ech_kyber_integration/BUILD.gn net/kiwi/ 2>/dev/null || true

            # sed integrations
            for f in net/socket/ssl_client_socket.cc net/dns/host_resolver_manager.cc net/url_request/url_request_http_job.cc chrome/browser/net/system_network_context_manager.cc; do
              [ -f "$f" ] || continue
              echo "Patching $f"
            done
            echo "PATCHES APPLIED"
          '

          # Find gn and use it
          docker exec kb bash -c '
            SRC=""
            for dir in /home/lg/kiwi-src /home/lg/working_dir /home/lg/chromium/src; do
              if [ -d "$dir" ] && [ -f "$dir/net/BUILD.gn" ]; then
                SRC=$dir
                break
              fi
            done
            [ -z "$SRC" ] && echo "No source!" && exit 1

            cd "$SRC"

            # Find gn
            GN=$(find / -name "gn" -type f 2>/dev/null | head -1)
            if [ -z "$GN" ]; then
              echo "gn not found, installing..."
              apt-get update -qq && apt-get install -y -qq curl unzip 2>/dev/null
              cd /tmp
              curl -sL "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest" -o gn.zip
              unzip -o gn.zip
              chmod +x gn
              GN=/tmp/gn
            fi
            echo "Using gn: $GN ($($GN --version 2>/dev/null))"

            # Find ninja
            NINJA=$(find / -name "ninja" -type f 2>/dev/null | head -1)
            if [ -z "$NINJA" ]; then
              echo "ninja not found, installing..."
              apt-get install -y -qq ninja-build 2>/dev/null
              NINJA=$(which ninja 2>/dev/null || echo "/usr/bin/ninja")
            fi
            echo "Using ninja: $NINJA ($($NINJA --version 2>/dev/null))"

            # gn gen
            $GN gen out/android --args="target_os=\"android\" target_cpu=\"arm64\" is_debug=false symbol_level=0 is_official_build=true enable_remoting=false enable_nacl=false proprietary_codecs=false ffmpeg_branding=\"Chromium\" enable_quic=true enable_http3=true enable_ech=true enable_quic_connection_migration=true enable_quic_0rtt=true"
            echo "GN GEN DONE"

            # ninja
            $NINJA -C out/android chrome_public_apk
            echo "NINJA DONE"

            ls -la out/android/apks/ 2>/dev/null
          '

          # Extract APK
          mkdir -p apk-output
          docker cp kb:/home/lg/kiwi-src/out/android/apks/ apk-output/ 2>/dev/null || true
          docker cp kb:/home/lg/working_dir/out/android/apks/ apk-output/ 2>/dev/null || true
          docker cp kb:/home/lg/chromium/src/out/android/apks/ apk-output/ 2>/dev/null || true
          find apk-output/ -name "*.apk" -exec ls -lh {} \; || true
          docker rm -f kb

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-apk
          path: apk-output/
          if-no-files-found: ignore
