name: Verify Kiwi Network Patches

on:
  workflow_dispatch:
  push:
    branches: [main, kiwi]

env:
  CHROMIUM_SRC: ${{ github.workspace }}/src
  PATCH_DIR: ${{ github.workspace }}/patches

jobs:
  # -----------------------------------------------------------
  # Step 1: verify patch file structure
  # -----------------------------------------------------------
  verify_patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 curl git

      - name: Clone Kiwi source (shallow)
        run: |
          git clone --depth=1 -b kiwi https://github.com/kiwibrowser/src.next.git $CHROMIUM_SRC

      - name: Apply patches
        run: |
          mkdir -p $CHROMIUM_SRC/net/kiwi/
          cp $PATCH_DIR/ech_kyber_integration/*.cc $CHROMIUM_SRC/net/kiwi/
          cp $PATCH_DIR/ech_kyber_integration/*.h  $CHROMIUM_SRC/net/kiwi/
          cp $PATCH_DIR/ech_kyber_integration/BUILD.gn $CHROMIUM_SRC/net/kiwi/
          cp $PATCH_DIR/ech_kyber_integration/net_base_features.patch $CHROMIUM_SRC/net/base/ 2>/dev/null || true
          echo "Patched files: $(ls $CHROMIUM_SRC/net/kiwi/ | wc -l)"

      - name: Verify patch existence
        run: |
          echo "CC files: $(ls $PATCH_DIR/ech_kyber_integration/*.cc 2>/dev/null | wc -l)"
          echo "H  files: $(ls $PATCH_DIR/ech_kyber_integration/*.h 2>/dev/null | wc -l)"
          echo "BUILD.gn: $(ls $PATCH_DIR/ech_kyber_integration/BUILD.gn 2>/dev/null)"
          python3 $PATCH_DIR/.github/scripts/verify_build_gn.py

  # -----------------------------------------------------------
  # Step 2: full Android build inside uazo's Chromium Docker image
  # -----------------------------------------------------------
  compile_android:
    needs: [verify_patches]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android

      - name: Pull Chromium build image
        run: |
          docker pull uazo/chromium:143.0.7499.193

      - name: Check build environment
        run: |
          docker run --rm uazo/chromium:143.0.7499.193 bash -c '
            echo "=== Tools ==="
            which gn ninja g++ clang++ 2>&1
            gn --version 2>/dev/null
            echo "=== Android NDK ==="
            ls /opt/android* 2>/dev/null || echo "no /opt/android"
            echo "ANDROID_NDK=${ANDROID_NDK:-unset}"
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "=== Working dir ==="
            ls -la
            echo "=== .gn file ==="
            ls .gn 2>/dev/null && echo "OK" || echo ".gn missing - this is an issue"
          '

      - name: Prepare build script
        run: |
          cat > /tmp/build_kiwi.sh << 'SCRIPT'
          set -e -x
          cd /home/lg/working_dir
          echo "=== Kiwi files before copy ==="
          ls -la net/kiwi/ 2>/dev/null || echo "no net/kiwi/ yet"
          mkdir -p net/kiwi/
          cp /tmp/patches/*.cc net/kiwi/ 2>/dev/null || echo "no .cc files"
          cp /tmp/patches/*.h  net/kiwi/ 2>/dev/null || echo "no .h files"
          cp /tmp/patches/BUILD.gn net/kiwi/ 2>/dev/null || echo "no BUILD.gn"
          echo "=== Kiwi files ==="
          ls -la net/kiwi/
          echo "=== GN Gen ==="
          gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false symbol_level=0'
          echo "=== GN Gen done ==="
          ls out/Default/
          SCRIPT
          chmod +x /tmp/build_kiwi.sh

      - name: Run build inside container
        run: |
          docker run --name kiwi-builder \
            -v $PWD/patches/ech_kyber_integration:/tmp/patches \
            -v /tmp/build_kiwi.sh:/tmp/build_kiwi.sh:ro \
            uazo/chromium:143.0.7499.193 \
            bash /tmp/build_kiwi.sh

      - name: Ninja build
        run: |
          docker start kiwi-builder 2>/dev/null || true
          docker exec kiwi-builder bash -c 'cd /home/lg/working_dir && ninja -C out/Default net' | tail -30

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p build-output
          docker cp kiwi-builder:/home/lg/working_dir/out/Default/obj/net/kiwi build-output/ 2>/dev/null || true
          docker cp kiwi-builder:/home/lg/working_dir/out/Default/obj/net/kiwi_network build-output/ 2>/dev/null || true
          docker rm -f kiwi-builder 2>/dev/null || true
          find build-output/ -name '*.o' -o -name '*.a' | head -10

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-build
          path: build-output/
          if-no-files-found: warn

  # -----------------------------------------------------------
  # Step 3: quick g++ syntax verification on ubuntu-latest
  # -----------------------------------------------------------
  verify_compilation:
    needs: [verify_patches]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Sparse checkout Chromium
        run: |
          git clone --depth=1 --filter=blob:none --no-checkout \
            https://github.com/chromium/chromium.git chromium-src
          cd chromium-src
          git sparse-checkout set \
            .gn BUILD.gn net/ base/ build/ build_overrides/ \
            crypto/ url/ testing/ third_party/boringssl/ \
            third_party/zlib/ third_party/abseil-cpp/ \
            third_party/perfetto/ third_party/googletest/ \
            third_party/partition_alloc/
          git checkout

      - name: Copy Kiwi files
        run: |
          mkdir -p chromium-src/net/kiwi
          cp patches/ech_kyber_integration/*.cc chromium-src/net/kiwi/
          cp patches/ech_kyber_integration/*.h chromium-src/net/kiwi/
          cp patches/ech_kyber_integration/BUILD.gn chromium-src/net/kiwi/

      - name: Install libc++ (needed by clang for Chromium headers)
        run: |
          sudo apt-get install -y --no-install-recommends libc++-dev libc++abi-dev

      - name: Find libc++ headers
        run: |
          echo "=== clang include paths ==="
          clang++ -std=c++20 -stdlib=libc++ -v -E -x c++ /dev/null 2>&1 | grep -E "^" | head -20
          echo "=== Locate libc++ headers ==="
          dpkg -L libc++-dev 2>/dev/null | grep -E "include.*c\+\+" | head -5
          dpkg -L libc++abi-dev 2>/dev/null | grep -E "include.*c\+\+" | head -5
          echo "=== Check /usr/include/c++/v1/ ==="
          ls /usr/include/c++/v1/ 2>/dev/null | head -5 || echo "not found"

      - name: Compile with clang++ and libc++
        run: |
          cd chromium-src
          mkdir -p out/verify
          # Find C++ headers path
          LIBCXX_INC="/usr/include/c++/v1"
          if [ ! -d "$LIBCXX_INC" ]; then
            echo "libc++ headers not found, falling back to libstdc++"
            CXX="clang++ -std=c++20 -fPIC -O2"
          else
            CXX="clang++ -std=c++20 -fPIC -O2 -stdlib=libc++ -nostdinc++ -cxx-isystem $LIBCXX_INC"
          fi
          INCS="-I. -Inet -Ibase -Ibuild -Ibuild_overrides"
          INCS="$INCS -Ithird_party/boringssl/src/include"
          INCS="$INCS -Ithird_party/zlib -Iurl -Icrypto"
          INCS="$INCS -Ithird_party/abseil-cpp -Ithird_party/perfetto"
          INCS="$INCS -Ithird_party/googletest/src/googletest/include"
          INCS="$INCS -Ithird_party/partition_alloc"
          DEFS="-DNET_IMPLEMENTATION=1 -DBORINGSSL_IMPLEMENTATION=1"
          DEFS="$DEFS -DOPENSSL_IS_BORINGSSL=1"

          PASS=0; FAIL=0
          for f in net/kiwi/*.cc; do
            base=$(basename $f .cc)
            if [ "$base" = "mojo_ipc_integration" ]; then
              echo "$base.cc ... SKIP (needs mojom headers)"
              continue
            fi
            echo -n "$base.cc ... "
            LOG="/tmp/$base.err"
            if $CXX -c "$f" $INCS $DEFS -o out/verify/$base.o 2>$LOG; then
              echo "OK"; PASS=$((PASS+1))
            else
              echo "FAIL"
              head -3 $LOG
              FAIL=$((FAIL+1))
            fi
          done
          echo "Result: $PASS passed, $FAIL failed"
          if [ $FAIL -gt 0 ]; then
            echo "=== First error details ==="
            for f in net/kiwi/*.cc; do
              base=$(basename $f .cc)
              [ -f "/tmp/$base.err" ] && head -15 /tmp/$base.err && break
            done
          fi
          exit $FAIL
