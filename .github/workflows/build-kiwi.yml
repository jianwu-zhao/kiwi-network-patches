name: Kiwi Network Patches Build

on:
  workflow_dispatch:
  push:
    branches: [kiwi]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Build
        timeout-minutes: 300
        run: |
          docker pull uazo/chromium:143.0.7499.193
          docker run -d --name kb -v "$PWD/patches:/tmp/p:ro" uazo/chromium:143.0.7499.193 tail -f /dev/null
          docker cp "$PWD/patches/scripts/docker_build.sh" kb:/tmp/docker_build.sh
          docker exec -u root kb bash /tmp/docker_build.sh 2>&1
          mkdir -p apk-output
          docker cp kb:/home/lg/working_dir/chromium/src/out/android/apks/ apk-output/ 2>/dev/null || true
          find apk-output/ -name "*.apk" -exec ls -lh {} \; || echo "no apk"
          docker rm -f kb || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-apk
          path: apk-output/
          if-no-files-found: ignore
