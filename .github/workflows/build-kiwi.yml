name: Verify Kiwi Network Patches

on:
  workflow_dispatch:
  push:
    branches: [ main, kiwi ]

env:
  CHROMIUM_SRC: ${{ github.workspace }}/src
  PATCH_DIR: ${{ github.workspace }}/patches

jobs:
  verify_patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 curl git

      - name: Clone Kiwi source (shallow)
        run: |
          git clone --depth=1 -b kiwi https://github.com/kiwibrowser/src.next.git $CHROMIUM_SRC
          echo "HEAD: $(git log --oneline -1)"

      - name: Apply patches
        run: |
          cd $CHROMIUM_SRC
          mkdir -p net/kiwi/
          cp $PATCH_DIR/ech_kyber_integration/*.cc $PATCH_DIR/ech_kyber_integration/*.h net/kiwi/
          echo "Kiwi files: $(ls net/kiwi/ | wc -l)"

      - name: Verify patch files
        run: |
          echo "CC: $(ls $PATCH_DIR/ech_kyber_integration/*.cc 2>/dev/null | wc -l)"
          echo "H:  $(ls $PATCH_DIR/ech_kyber_integration/*.h 2>/dev/null | wc -l)"
          echo "GN: $(ls $PATCH_DIR/ech_kyber_integration/BUILD.gn 2>/dev/null)"
          python3 $PATCH_DIR/.github/scripts/verify_build_gn.py

      - name: Summary
        run: |
          echo "=== Patch Summary ==="
          echo "Patch files: $(ls $PATCH_DIR/ech_kyber_integration/*.cc 2>/dev/null | wc -l) .cc"
          echo "             $(ls $PATCH_DIR/ech_kyber_integration/*.h 2>/dev/null | wc -l) .h"

  # -----------------------------------------------------------
  # Full Android build using uazo's Chromium Docker image
  # -----------------------------------------------------------
  compile_android:
    needs: [verify_patches]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          echo "Free space: $(df -h / | tail -1 | awk '{print $4}')"

      - name: Pull Chromium build image
        run: |
          docker pull uazo/chromium:143.0.7499.193
          docker images --format "table {{.Repository}}:{{.Tag}}  {{.Size}}"

      - name: Build patched image
        run: |
          cat > Dockerfile << 'DF'
FROM uazo/chromium:143.0.7499.193
USER root
RUN mkdir -p /home/lg/working_dir/net/kiwi
COPY patches/ech_kyber_integration/*.cc /home/lg/working_dir/net/kiwi/
COPY patches/ech_kyber_integration/*.h  /home/lg/working_dir/net/kiwi/
COPY patches/ech_kyber_integration/BUILD.gn /home/lg/working_dir/net/kiwi/
RUN chown -R lg:lg /home/lg/working_dir/net/kiwi
USER lg
WORKDIR /home/lg/working_dir
DF
          docker build -t kiwi-builder .

      - name: Build Kiwi net module (Android arm64)
        run: |
          docker run --rm kiwi-builder bash -c '
            set -e -x
            cd /home/lg/working_dir
            echo "=== Kiwi files ==="
            ls -la net/kiwi/
            echo "=== GN Gen ==="
            gn gen out/Default --args="
              target_os=\"android\"
              target_cpu=\"arm64\"
              is_debug=false
              symbol_level=0
              is_official_build=true
              enable_remoting=false
              enable_nacl=false
              proprietary_codecs=false
              ffmpeg_branding=\"Chromium\"
            "
            echo "=== Build net target ==="
            ninja -C out/Default net 2>&1 | tail -30
          '

      - name: Collect build artifacts
        if: always()
        run: |
          echo "=== Collecting artifacts ==="
          mkdir -p build-output
          docker create --name kiwi-tmp kiwi-builder
          docker cp kiwi-tmp:/home/lg/working_dir/out/Default/obj/net/kiwi build-output/ 2>/dev/null || true
          docker cp kiwi-tmp:/home/lg/working_dir/out/Default/obj/net/kiwi_network build-output/ 2>/dev/null || true
          docker rm kiwi-tmp
          find build-output/ -type f -name "*.o" -o -name "*.a" 2>/dev/null | head -20

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-build
          path: build-output/
          if-no-files-found: warn

  # -----------------------------------------------------------
  # Quick verification: compile .cc files with g++ on Ubuntu
  # -----------------------------------------------------------
  verify_compilation:
    needs: [verify_patches]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Sparse checkout Chromium
        run: |
          git clone --depth=1 --filter=blob:none --no-checkout \
            https://github.com/chromium/chromium.git chromium-src
          cd chromium-src
          git sparse-checkout set \
            .gn BUILD.gn net/ base/ build/ build_overrides/ \
            crypto/ url/ testing/ third_party/boringssl/ \
            third_party/zlib/ third_party/abseil-cpp/ \
            third_party/perfetto/ third_party/googletest/ \
            third_party/partition_alloc/
          git checkout
          du -sh .

      - name: Copy Kiwi files
        run: |
          mkdir -p chromium-src/net/kiwi
          cp patches/ech_kyber_integration/*.cc chromium-src/net/kiwi/
          cp patches/ech_kyber_integration/*.h chromium-src/net/kiwi/
          cp patches/ech_kyber_integration/BUILD.gn chromium-src/net/kiwi/
          echo "Files: $(ls chromium-src/net/kiwi/ | wc -l)"

      - name: Compile with g++
        run: |
          cd chromium-src
          mkdir -p out/verify
          INCS="-I. -Inet -Ibase -Ibuild -Ibuild_overrides"
          INCS="$INCS -Ithird_party/boringssl/src/include"
          INCS="$INCS -Ithird_party/zlib -Iurl -Icrypto"
          INCS="$INCS -Ithird_party/abseil-cpp -Ithird_party/perfetto"
          INCS="$INCS -Ithird_party/googletest/src/googletest/include"
          INCS="$INCS -Ithird_party/partition_alloc"
          DEFS="-DNET_IMPLEMENTATION=1 -DBORINGSSL_IMPLEMENTATION=1"
          DEFS="$DEFS -DOPENSSL_IS_BORINGSSL=1"
          CXX="g++ -std=c++20 -fPIC -O2 -include /usr/include/features.h -D_GNU_SOURCE"

          PASS=0; FAIL=0
          for f in net/kiwi/*.cc; do
            base=$(basename $f .cc)
            [ "$base" = "mojo_ipc_integration" ] && continue
            echo -n "$base.cc ... "
            if $CXX -c "$f" $INCS $DEFS -o out/verify/$base.o 2>/dev/null; then
              echo "OK"; PASS=$((PASS+1))
            else
              echo "FAIL"; FAIL=$((FAIL+1))
            fi
          done
          echo "Result: $PASS passed, $FAIL failed"
          if [ $FAIL -eq 0 ]; then
            ar rcs out/verify/libkiwi_network.a out/verify/*.o
            echo "libkiwi_network.a: $(ls -lh out/verify/libkiwi_network.a | awk '\''{print $5}'\'')"
          fi
          exit $FAIL
