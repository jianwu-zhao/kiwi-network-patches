name: Kiwi Network Patches Build

on:
  workflow_dispatch:
  push:
    branches: [kiwi]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Pull image
        run: docker pull uazo/chromium:143.0.7499.193

      - name: Full Build
        timeout-minutes: 300
        run: |
          # Start container
          docker run -d --name kb -v "$PWD/patches:/tmp/p:ro" uazo/chromium:143.0.7499.193 tail -f /dev/null

          # ALL build logic in one script
          docker exec -u root kb bash -c '
            set -x

            SRC=/home/lg/working_dir/chromium/src
            DT=/home/lg/working_dir/depot_tools

            echo "=== 1. Check source ==="
            ls "$SRC/net/" | head -3
            ls "$DT/gn" "$DT/ninja"

            echo "=== 2. Install clang (required for Chromium build) ==="
            apt-get update -qq 2>/dev/null
            apt-get install -y -qq clang-10 lld-10 2>/dev/null || apt-get install -y -qq clang lld 2>/dev/null || echo "apt failed"
            which clang++ 2>/dev/null && clang++ --version || echo "NO clang++"

            echo "=== 3. Apply patches ==="
            cd "$SRC"
            for pf in /tmp/p/*.patch; do
              [ -f "$pf" ] || continue
              patch -p1 --force < "$pf" 2>&1 | tail -2
            done
            mkdir -p net/kiwi/unittests
            cp /tmp/p/ech_kyber_integration/*.cc net/kiwi/ 2>/dev/null || true
            cp /tmp/p/ech_kyber_integration/*.h net/kiwi/ 2>/dev/null || true
            cp /tmp/p/ech_kyber_integration/BUILD.gn net/kiwi/ 2>/dev/null || true
            # sed integrations
            grep -q "kiwi_ssl_config" net/socket/ssl_client_socket.cc 2>/dev/null || sed -i "/#include \"net\/ssl\/ssl_config\"/a #include \"net\/kiwi\/kiwi_ssl_config.h\"" net/socket/ssl_client_socket.cc 2>/dev/null || true
            grep -q "ConfigureKiwiSSL" net/socket/ssl_client_socket.cc 2>/dev/null || sed -i "/SSL_set_connect_state(ssl_.get())/a \/\/ Kiwi SSL\n  ConfigureKiwiSSL(ssl_.get(), ssl_ctx_.get(), ssl_config_);" net/socket/ssl_client_socket.cc 2>/dev/null || true
            grep -q "kiwi_dns_handler" net/dns/host_resolver_manager.cc 2>/dev/null || sed -i "/#include \"net\/dns\/host_resolver_manager.h\"/a #include \"net\/kiwi\/kiwi_dns_handler.h\"" net/dns/host_resolver_manager.cc 2>/dev/null || true
            grep -q "kiwi_url_request" net/url_request/url_request_http_job.cc 2>/dev/null || sed -i "/#include \"net\/url_request\/url_request_http_job.h\"/a #include \"net\/kiwi\/kiwi_url_request.h\"" net/url_request/url_request_http_job.cc 2>/dev/null || true
            grep -q "kiwi_system_net" chrome/browser/net/system_network_context_manager.cc 2>/dev/null || sed -i "/#include \"chrome\/browser\/net\/system_network_context_manager.h\"/a #include \"net\/kiwi\/kiwi_system_net.h\"" chrome/browser/net/system_network_context_manager.cc 2>/dev/null || true
            sed -i "s/base::FEATURE_DISABLED_BY_DEFAULT};$/base::FEATURE_ENABLED_BY_DEFAULT};/g" net/base/features.cc 2>/dev/null || true
            echo "Patches applied"

            echo "=== 4. gn gen ==="
            export PATH="$DT:$PATH"
            gn gen out/android --args="target_os=\"android\" target_cpu=\"arm64\" is_debug=false symbol_level=0 is_official_build=true enable_remoting=false enable_nacl=false proprietary_codecs=false ffmpeg_branding=\"Chromium\" enable_quic=true enable_http3=true enable_ech=true enable_quic_connection_migration=true enable_quic_0rtt=true" 2>&1
            echo "gn gen exit: $?"

            echo "=== 5. ninja build ==="
            ninja -C out/android chrome_public_apk 2>&1
            echo "ninja exit: $?"

            echo "=== 6. Find APK ==="
            find out/android -name "*.apk" 2>/dev/null | head -5
            ls -la out/android/apks/ 2>/dev/null || true
          ' 2>&1 | tee /tmp/build_log.txt

          # Extract APK
          mkdir -p apk-output
          docker cp kb:/home/lg/working_dir/chromium/src/out/android/apks/ apk-output/ 2>/dev/null || true
          docker cp kb:/home/lg/working_dir/chromium/src/out/android/Release/ apk-output/ 2>/dev/null || true
          find apk-output/ -name "*.apk" -exec ls -lh {} \; || echo "no apk found"
          docker rm -f kb || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-apk
          path: apk-output/
          if-no-files-found: ignore
