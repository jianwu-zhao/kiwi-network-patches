name: Kiwi Network Patches Build

on:
  workflow_dispatch:
  push:
    branches: [kiwi]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: patches

      - name: Free disk
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build curl unzip python3-pip

      - name: Clone Kiwi source
        run: |
          rm -rf /home/runner/kiwi-src
          git clone --depth=1 -b kiwi https://github.com/kiwibrowser/src.next.git /home/runner/kiwi-src

      - name: Verify clone
        run: |
          ls /home/runner/kiwi-src/build/install-build-deps.sh && echo "FOUND install-build-deps.sh"
          ls /home/runner/kiwi-src/net/BUILD.gn && echo "FOUND net/BUILD.gn"
          du -sh /home/runner/kiwi-src 2>/dev/null || echo "size check failed"

      - name: Apply patches
        run: |
          cd /home/runner/kiwi-src
          for pf in "$GITHUB_WORKSPACE/patches"/*.patch; do
            [ -f "$pf" ] || continue
            patch -p1 --force < "$pf"
          done
          mkdir -p net/kiwi/unittests
          cp "$GITHUB_WORKSPACE/patches"/ech_kyber_integration/*.cc net/kiwi/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/patches"/ech_kyber_integration/*.h net/kiwi/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/patches"/ech_kyber_integration/BUILD.gn net/kiwi/ 2>/dev/null || true
          grep -q "kiwi_ssl_config" net/socket/ssl_client_socket.cc 2>/dev/null || sed -i "/#include \"net\/ssl\/ssl_config\"/a #include \"net\/kiwi\/kiwi_ssl_config.h\"" net/socket/ssl_client_socket.cc 2>/dev/null || true
          grep -q "ConfigureKiwiSSL" net/socket/ssl_client_socket.cc 2>/dev/null || sed -i "/SSL_set_connect_state(ssl_.get())/a \/\/ Kiwi SSL\n  ConfigureKiwiSSL(ssl_.get(), ssl_ctx_.get(), ssl_config_);" net/socket/ssl_client_socket.cc 2>/dev/null || true
          grep -q "kiwi_dns_handler" net/dns/host_resolver_manager.cc 2>/dev/null || sed -i "/#include \"net\/dns\/host_resolver_manager.h\"/a #include \"net\/kiwi\/kiwi_dns_handler.h\"" net/dns/host_resolver_manager.cc 2>/dev/null || true
          grep -q "kiwi_url_request" net/url_request/url_request_http_job.cc 2>/dev/null || sed -i "/#include \"net\/url_request\/url_request_http_job.h\"/a #include \"net\/kiwi\/kiwi_url_request.h\"" net/url_request/url_request_http_job.cc 2>/dev/null || true
          grep -q "kiwi_system_net" chrome/browser/net/system_network_context_manager.cc 2>/dev/null || sed -i "/#include \"chrome\/browser\/net\/system_network_context_manager.h\"/a #include \"net\/kiwi\/kiwi_system_net.h\"" chrome/browser/net/system_network_context_manager.cc 2>/dev/null || true
          sed -i "s/base::FEATURE_DISABLED_BY_DEFAULT};$/base::FEATURE_ENABLED_BY_DEFAULT};/g" net/base/features.cc 2>/dev/null || true
          echo "=== Patches applied ==="

      - name: Install Chromium build deps
        run: |
          cd /home/runner/kiwi-src
          sudo ./build/install-build-deps.sh --android --no-prompt

      - name: Get Clang toolchain
        run: |
          cd /home/runner/kiwi-src
          python3 tools/clang/scripts/update.py
          ls -la third_party/llvm-build/Release+Asserts/bin/clang++

      - name: Install gn
        run: |
          if which gn; then
            echo "gn already installed: $(gn --version)"
            exit 0
          fi
          if [ -f /home/runner/kiwi-src/buildtools/linux64/gn ]; then
            echo "Found gn in buildtools:"
            /home/runner/kiwi-src/buildtools/linux64/gn --version
            sudo cp /home/runner/kiwi-src/buildtools/linux64/gn /usr/local/bin/
            exit 0
          fi
          # Download from CIPD
          mkdir -p /tmp/gn-install
          curl -sL --max-time 30 "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest" -o /tmp/gn-install/gn.zip
          if [ -s /tmp/gn-install/gn.zip ]; then
            (cd /tmp/gn-install && unzip -o gn.zip)
            sudo cp /tmp/gn-install/gn /usr/local/bin/
            gn --version
            exit 0
          fi
          # Build from source
          cd /home/runner/kiwi-src/tools/gn
          python3 bootstrap.py
          sudo cp out/gn /usr/local/bin/
          gn --version

      - name: GN Gen
        run: |
          cd /home/runner/kiwi-src
          gn gen out/android --args='target_os="android" target_cpu="arm64" is_debug=false symbol_level=0 is_official_build=true enable_remoting=false enable_nacl=false proprietary_codecs=false ffmpeg_branding="Chromium" enable_quic=true enable_http3=true enable_ech=true enable_quic_connection_migration=true enable_quic_0rtt=true'

      - name: Ninja build
        timeout-minutes: 180
        run: |
          cd /home/runner/kiwi-src
          ninja -C out/android chrome_public_apk

      - name: Extract APK
        if: always()
        run: |
          mkdir -p apk-output
          find /home/runner/kiwi-src/out/android -name "*.apk" -exec cp {} apk-output/ \;
          ls -lh apk-output/ || echo "no APK files"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-apk
          path: apk-output/
          if-no-files-found: ignore
