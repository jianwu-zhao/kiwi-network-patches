name: Verify Kiwi Network Patches

on:
  workflow_dispatch:
  push:
    branches: [ main, kiwi ]

env:
  CHROMIUM_SRC: ${{ github.workspace }}/src
  PATCH_DIR: ${{ github.workspace }}/patches

jobs:
  verify_patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip curl git lsb-release g++ clang

      - name: Clone Kiwi source (shallow)
        run: |
          git clone --depth=1 -b kiwi \
            https://github.com/kiwibrowser/src.next.git \
            $CHROMIUM_SRC
          echo "HEAD: $(git log --oneline -1)"
          echo "Size: $(du -sh $CHROMIUM_SRC | cut -f1)"

      - name: Apply patches
        run: |
          cd $CHROMIUM_SRC
          mkdir -p net/kiwi/
          cp $PATCH_DIR/ech_kyber_integration/*.cc  \
             $PATCH_DIR/ech_kyber_integration/*.h   \
             $PATCH_DIR/ech_kyber_integration/BUILD.gn \
             net/kiwi/
          echo "=== Files in net/kiwi/ ==="
          ls -la net/kiwi/

      - name: Verify patch files integrity
        run: |
          echo "=== Checking patch file integrity ==="
          echo "CC files: $(ls $PATCH_DIR/ech_kyber_integration/*.cc 2>/dev/null | wc -l)"
          echo "H files: $(ls $PATCH_DIR/ech_kyber_integration/*.h 2>/dev/null | wc -l)"
          echo "BUILD.gn: $(ls $PATCH_DIR/ech_kyber_integration/BUILD.gn 2>/dev/null)"
          echo "Unit tests: $(ls $PATCH_DIR/ech_kyber_integration/unittests/*.cc 2>/dev/null | wc -l)"
          echo ""
          echo "=== Checking Kiwi source target files ==="
          for f in net/base/features.cc net/socket/ssl_client_socket.cc \
                   net/dns/host_resolver_manager.cc net/url_request/url_request_http_job.cc \
                   chrome/browser/net/system_network_context_manager.cc; do
            if [ -f "$CHROMIUM_SRC/$f" ]; then echo "  OK $f"; else echo "  MISS $f (will be patched)"; fi
          done

      - name: Verify BUILD.gn syntax
        run: |
          python3 -c "
import os, re
src = os.environ['CHROMIUM_SRC']
content = open(os.path.join(src, 'net/kiwi/BUILD.gn')).read()
checks = {
  'source_set declaration': 'source_set(\"kiwi_net_extensions\"' in content,
  'sources list': 'sources' in content,
  'deps list': 'deps' in content,
  'public header': 'public' in content,
  'configs': 'configs' in content,
}
for name, passed in checks.items():
  print(f\"  {'OK' if passed else 'FAIL'} {name}\")
sources = re.findall(r'\"([^\"]+\.cc)\"', content)
headers = re.findall(r'\"([^\"]+\.h)\"', content)
print(f\"  SRC refs: {len(sources)}\")
print(f\"  HDR refs: {len(headers)}\")
print()
print('BUILD.gn verification passed')
"

      - name: Summary
        run: |
          echo "=== Summary ==="
          echo "Patch files: $(ls ${{ env.PATCH_DIR }}/ech_kyber_integration/*.cc 2>/dev/null | wc -l) .cc"
          echo "             $(ls ${{ env.PATCH_DIR }}/ech_kyber_integration/*.h 2>/dev/null | wc -l) .h"
          echo "Unit tests:  $(ls ${{ env.PATCH_DIR }}/ech_kyber_integration/unittests/*.cc 2>/dev/null | wc -l)"
          echo "BUILD.gn:    structure validated"
          echo ""
          echo "Full compilation requires complete Chromium source (40GB+)"
