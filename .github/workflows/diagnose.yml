name: Docker Image Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull and Diagnose
        run: |
          docker pull uazo/chromium:143.0.7499.193
          docker run --rm uazo/chromium:143.0.7499.193 bash -c '
            echo "PATH=$PATH"
            echo "---"
            which gn ninja clang++ g++ 2>&1
            echo "---"
            find / -maxdepth 4 -name "gn" -o -name "ninja" -o -name "clang++" 2>/dev/null
            echo "---"
            ls /home/lg/ 2>&1
          ' 2>&1 | tee /tmp/diag.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: /tmp/diag.txt
